version: '3'

services:
  nginx:
    image: nginx:latest
    container_name: Nginx7
    ports:
      - 5000:80

  apache:
    image: httpd:latest
    container_name: Apache7
    ports:
      - 5001:80

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: PHPmyadmin7
    ports:
      - 5002:80
