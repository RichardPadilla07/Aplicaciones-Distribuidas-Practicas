version: '3'
services:
  aplicacion:
    container_name: AplicacionWeb
    build:
      dockerfile: Dockerfile
    ports:
      - 5000:5000
    environment:
      - MYSQL_HOST=base_datos
      - MYSQL_USER=root
      - MYSQL_PASSWORD=root
      - MYSQL_DB=db_informacion
      - MYSQL_PORT=3306

  base_datos:
    container_name: Base1
    image: mysql:8.0
    ports:
      - 3308:3306
    volumes:
      - data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=db_informacion

  phpmyadmin:
    container_name: php78
    image: phpmyadmin:latest
    ports:
      - 8080:80
    environment:
      - PMA_HOST=base_datos
      - PMA_PORT=3306
    depends_on:
      - base_datos

  locust:
    container_name: locust35
    image: locustio/locust:latest
    ports:
      - 8087:8089
    volumes: 
      - C:\Users\APP DISTRIBUIDAS\Desktop\Aplicaciones Distribuidas Practicas\PRendimiento\locustfile.py:/mnt/locust/locustfile.py
    command: ["-f", "/mnt/locust/locustfile.py"]

volumes:
  data:
